name: Colmeia de commits

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/colmeia/**"
      - ".github/workflows/colmeia.yml"

jobs:
  colmeia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar a colmeia
        run: node .github/colmeia/gerar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
          SAIDA: dist

      - name: Publicar na branch colmeia
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: colmeia
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
